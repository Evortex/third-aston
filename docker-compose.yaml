services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - microservices-net

  eureka-server:
    build: ./service-registry
    container_name: eureka-server
    restart: always
    ports:
      - "8762:8762"
    environment:
      - SERVER_PORT=8762
    networks:
      - microservices-net

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - microservices-net

  postgres-order:
    image: postgres:latest
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  postgres-payment:
    image: postgres:latest
    container_name: postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  postgres-ticket:
    image: postgres:latest
    container_name: postgres-ticket
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ticket_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - service-registry
      - config-service
      - postgres-order
      - kafka
    networks:
      - microservices-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    depends_on:
      - service-registry
      - config-service
      - postgres-payment
      - kafka
    networks:
      - microservices-net

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "8083:8083"
    depends_on:
      - service-registry
      - config-service
      - postgres-ticket
      - kafka
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
      - config-service
      - order-service
      - payment-service
      - ticket-service
    networks:
      - backend

volumes:
  order_data:
  payment_data:
  ticket_data:

networks:
  microservices-net:
    driver: bridge